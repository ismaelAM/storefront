name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check:locales

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  e2e:
    name: E2E (Playwright + Spree)
    # Repository secrets are not exposed to runs triggered from forks or
    # dependabot[bot]. Keep Stripe credentials private: when either key is
    # unavailable, the checkout E2E steps are skipped instead of failing CI.
    # The publishable key may live in Secrets (preferred here for isolation)
    # or, for backwards compatibility, in repository Variables.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check whether Stripe E2E credentials are available
        id: stripe
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || vars.STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stripe-backed E2E skipped because its GitHub Actions credentials are not available."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: steps.stripe.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.stripe.outputs.available == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.stripe.outputs.available == 'true'
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.stripe.outputs.available == 'true'
      # Key the browser cache on the Playwright version, not the whole
      # lockfile — unrelated dependency bumps shouldn't force a ~150MB
      # Chromium re-download.
      - name: Get Playwright version
        if: steps.stripe.outputs.available == 'true'
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.stripe.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.stripe.outputs.available == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps only
        if: steps.stripe.outputs.available == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Boot Spree backend (Postgres + Redis + latest Spree)
        if: steps.stripe.outputs.available == 'true'
        run: docker compose -f e2e-backend/docker-compose.yml up -d --wait
      - name: Seed Spree and issue API key
        if: steps.stripe.outputs.available == 'true'
        env:
          # Test-mode Stripe key pair from one sandbox account, consumed by
          # bootstrap-spree.sh to configure the Spree Stripe gateway. Scoped
          # to this step so dependency postinstall scripts and third-party actions
          # in other steps never see the secret.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || vars.STRIPE_PUBLISHABLE_KEY }}
        run: ./scripts/e2e/bootstrap-spree.sh
      - name: Run Playwright tests
        if: steps.stripe.outputs.available == 'true'
        run: pnpm run test:e2e
      - name: Dump Spree logs on failure
        if: failure() && steps.stripe.outputs.available == 'true'
        run: docker compose -f e2e-backend/docker-compose.yml logs --no-color web > spree.log || true
      - name: Upload failure artifacts
        if: failure() && steps.stripe.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            spree.log
          retention-days: 7
      - name: Tear down
        if: always() && steps.stripe.outputs.available == 'true'
        run: docker compose -f e2e-backend/docker-compose.yml down -v
