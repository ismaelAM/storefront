name: One-time final branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'One-time final branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete temporary branches
        env:
          BRANCHES: |
            tcgfactory-vercel-credentials
            remove-tcgfactory-bootstrap
            final-branch-cleanup
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            fi
          done <<< "$BRANCHES"

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-final-branch-cleanup.yml
          git commit -m "Remove one-time final branch cleanup workflow"
          git push origin HEAD:main
