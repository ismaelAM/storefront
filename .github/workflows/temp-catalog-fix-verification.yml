name: Temporary catalog fix verification

on:
  push:
    branches:
      - tcgfactory-vat-manga-404-fix

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- src/lib/supplier-pricing-policy.test.ts src/lib/utils/product-slug.test.ts src/lib/catalog-publish-policy.test.ts
      - run: pnpm exec tsc --noEmit
